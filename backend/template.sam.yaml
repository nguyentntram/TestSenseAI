AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TestSense AI — full stack (API Gateway + Lambda + Step Functions + CloudFront/S3 frontend)

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 300
    Environment:
      Variables:
        DATABASE_URL: !Sub '{{resolve:secretsmanager:${SecretsPrefix}/database-url}}'
        SECRETS_PREFIX: !Ref SecretsPrefix
        AWS_REGION_OVERRIDE: !Ref AWS::Region

Parameters:
  SecretsPrefix:
    Type: String
    Default: testsense-ai/dev
  Environment:
    Type: String
    Default: dev
    AllowedValues: [prod, staging, dev]
  FrontendOrigin:
    Type: String
    Description: Deployed frontend origin (CloudFront URL) — used for CORS + OAuth redirects. Update and redeploy once the frontend distribution exists.
    Default: http://localhost:5173
  GithubClientId:
    Type: String
    Description: GitHub OAuth App client ID
  GithubCallbackUrl:
    Type: String
    Description: OAuth callback URL — placeholder until the API Gateway URL is known, then redeploy with the real value.
    Default: http://localhost:3001/auth/github/callback

Resources:

  # ── API Gateway (single REST API, proxy integration) ────────────────────────

  TestSenseApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      # No Cors: property here on purpose — API Gateway's auto-generated CORS
      # mock integration proved unreliable to keep in sync with FrontendOrigin
      # changes (stale OPTIONS responses survived multiple redeploys). Both
      # src/index.js (Method: ANY, handles OPTIONS itself via
      # buildCorsHeaders()) and webhook-handler (no browser CORS needed —
      # GitHub calls it server-to-server) don't need it.

  # ── Lambdas ───────────────────────────────────────────────────────────────

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'testsense-ai-${Environment}-api'
      CodeUri: ./
      Handler: src/index.handler
      Timeout: 30
      Environment:
        Variables:
          NODE_ENV: production
          APP_BASE_URL: !Ref FrontendOrigin
          CORS_ALLOWED_ORIGIN: !Ref FrontendOrigin
          GITHUB_CLIENT_ID: !Ref GithubClientId
          GITHUB_CLIENT_SECRET: !Sub '{{resolve:secretsmanager:${SecretsPrefix}/github-client-secret}}'
          GITHUB_CALLBACK_URL: !Ref GithubCallbackUrl
          OAUTH_STATE_SECRET: !Sub '{{resolve:secretsmanager:${SecretsPrefix}/oauth-state-secret}}'
          SESSION_SECRET: !Sub '{{resolve:secretsmanager:${SecretsPrefix}/session-secret}}'
          SESSION_COOKIE_NAME: testsense_session
          COOKIE_SECURE: 'true'
          SECRETS_PROVIDER: aws
          SECRETS_NAME_PREFIX: !Ref SecretsPrefix
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
                - secretsmanager:CreateSecret
                - secretsmanager:DeleteSecret
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretsPrefix}/*'
      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref TestSenseApi
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref TestSenseApi
            Path: /
            Method: ANY

  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'testsense-ai-${Environment}-webhook-handler'
      CodeUri: ./
      Handler: lambdas/webhook-handler/index.handler
      Environment:
        Variables:
          WEBHOOK_SECRET_ARN: !Sub '${SecretsPrefix}/webhook-secret'
          PIPELINE_STATE_MACHINE_ARN: !Ref TestGenerationPipeline
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretsPrefix}/*'
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt TestGenerationPipeline.Name
      Events:
        WebhookApi:
          Type: Api
          Properties:
            RestApiId: !Ref TestSenseApi
            Path: /webhooks/github
            Method: POST

  PrRetrievalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'testsense-ai-${Environment}-pr-retrieval'
      CodeUri: ./
      Handler: lambdas/pr-retrieval/index.handler
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretsPrefix}/*'

  SimilaritySearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'testsense-ai-${Environment}-similarity-search'
      CodeUri: ./
      Handler: lambdas/memory/similarity-search/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: 'arn:aws:bedrock:*::foundation-model/amazon.titan-embed-text-v2:0'

  GenerateTestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'testsense-ai-${Environment}-generate-tests'
      CodeUri: ./
      Handler: lambdas/generation/generate-tests/index.handler
      Timeout: 600
      MemorySize: 1024
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              # us.anthropic.claude-sonnet-4-6 is a cross-region inference
              # profile, not a plain foundation model — it lives under a
              # different ARN resource type (inference-profile, scoped to
              # this account/region), not foundation-model/* like Titan.
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6*'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6*'

  IngestHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'testsense-ai-${Environment}-ingest-history'
      CodeUri: ./
      Handler: lambdas/memory/ingest-history/index.handler
      Timeout: 600
      Environment:
        Variables:
          SECRETS_PROVIDER: aws
          SECRETS_NAME_PREFIX: !Ref SecretsPrefix
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretsPrefix}/*'
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: 'arn:aws:bedrock:*::foundation-model/amazon.titan-embed-text-v2:0'

  # ── Step Functions ────────────────────────────────────────────────────────

  PipelineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePipelineLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt PrRetrievalFunction.Arn
                  - !GetAtt SimilaritySearchFunction.Arn
                  - !GetAtt GenerateTestsFunction.Arn

  TestGenerationPipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'testsense-ai-${Environment}-test-generation'
      Role: !GetAtt PipelineExecutionRole.Arn
      DefinitionSubstitutions:
        PrRetrievalFunctionArn: !GetAtt PrRetrievalFunction.Arn
        SimilaritySearchFunctionArn: !GetAtt SimilaritySearchFunction.Arn
        GenerateTestsFunctionArn: !GetAtt GenerateTestsFunction.Arn
      DefinitionUri: step-functions/test-generation-pipeline.asl.json

  # ── Frontend: S3 + CloudFront ────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'testsense-ai-${Environment}-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'testsense-ai-${Environment}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
        Origins:
          - Id: s3origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  ApiUrl:
    Description: Base URL of the deployed API
    Value: !Sub 'https://${TestSenseApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  WebhookUrl:
    Description: URL to register in GitHub repo webhook settings
    Value: !Sub 'https://${TestSenseApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/webhooks/github'
  FrontendBucketName:
    Description: S3 bucket to sync the built frontend into
    Value: !Ref FrontendBucket
  FrontendUrl:
    Description: CloudFront URL serving the frontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  PipelineStateMachineArn:
    Description: ARN of the test generation state machine
    Value: !Ref TestGenerationPipeline
    Export:
      Name: !Sub '${AWS::StackName}-PipelineArn'
